<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0f14">
<title>APEX Pixel TT</title>
<style>
  :root {
    --green: #39ff6e;
    --surface: #131920;
    --surface2: #1a2230;
    --surface3: #0d1219;
    --border: rgba(57,255,110,0.1);
    --border-hover: rgba(57,255,110,0.28);
    --text: #e8eaed;
    --text-muted: rgba(232,234,237,0.38);
    --red: #ff4d4d;
    --yellow: #f59e0b;
    --bg: #0a0f14;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    padding-top: calc(14px + env(safe-area-inset-top));
    background: var(--surface3);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .logo-img { width: 32px; height: 32px; border-radius: 8px; object-fit: cover; }
  .header-title { font-size: 15px; font-weight: 600; letter-spacing: 0.3px; }
  .header-title span { color: var(--green); }
  #clock { font-size: 13px; font-weight: 500; color: var(--text-muted); font-variant-numeric: tabular-nums; letter-spacing: 0.5px; }

  /* LAYOUT */
  .layout {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 16px;
    padding: 20px 20px 40px;
    max-width: 1400px;
    margin: 0 auto;
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
  }

  /* CARDS */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .card-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-muted);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .card-title .count-badge {
    background: rgba(57,255,110,0.12);
    color: var(--green);
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 20px;
  }

  /* ACCOUNTS LIST */
  .accounts-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .accounts-label { font-size: 12px; color: var(--text-muted); }
  .sel-btns { display: flex; gap: 6px; }
  .sel-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--green);
    font-size: 11px;
    font-family: -apple-system, sans-serif;
    padding: 3px 8px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .sel-btn:hover { background: rgba(57,255,110,0.06); border-color: var(--border-hover); }

  .account-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    margin-bottom: 7px;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
    background: var(--surface2);
  }
  .account-item:hover { border-color: var(--border-hover); }
  .account-item.selected { border-color: rgba(57,255,110,0.4); background: rgba(57,255,110,0.05); }
  .account-item input[type="checkbox"] { accent-color: var(--green); width: 15px; height: 15px; flex-shrink: 0; cursor: pointer; }
  .account-name { font-size: 14px; font-weight: 500; }
  .account-id { font-size: 11px; color: var(--text-muted); margin-top: 1px; }

  /* FORM */
  .form-group { margin-top: 14px; }
  .form-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px; display: block; }
  .form-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-family: -apple-system, sans-serif;
    font-size: 14px;
    padding: 9px 12px;
    transition: border-color 0.15s;
  }
  .form-input:focus { outline: none; border-color: var(--border-hover); }
  .form-input::placeholder { color: var(--text-muted); }
  select.form-input { cursor: pointer; }
  select.form-input option { background: var(--surface2); }

  /* CREATE BUTTON */
  .create-btn {
    width: 100%;
    margin-top: 16px;
    padding: 11px;
    background: rgba(57,255,110,0.12);
    border: 1px solid rgba(57,255,110,0.3);
    border-radius: 8px;
    color: var(--green);
    font-family: -apple-system, sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
  }
  .create-btn:hover:not(:disabled) { background: rgba(57,255,110,0.2); border-color: rgba(57,255,110,0.5); }
  .create-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* RESULTS */
  .results { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
  .result-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 9px 12px;
    border-radius: 7px;
    font-size: 13px;
  }
  .result-item.ok { background: rgba(57,255,110,0.07); border: 1px solid rgba(57,255,110,0.2); }
  .result-item.err { background: rgba(255,77,77,0.07); border: 1px solid rgba(255,77,77,0.2); }
  .result-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
  .result-name { font-weight: 500; }
  .result-pid { font-size: 11px; color: var(--text-muted); margin-top: 2px; font-family: monospace; }
  .result-err { font-size: 11px; color: var(--red); margin-top: 2px; }

  /* TABLE */
  .table-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .refresh-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    font-size: 13px;
    padding: 5px 10px;
    cursor: pointer;
    font-family: -apple-system, sans-serif;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: border-color 0.15s, color 0.15s;
  }
  .refresh-btn:hover { border-color: var(--border-hover); color: var(--text); }
  .refresh-btn.spinning svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 600px; }
  thead th {
    padding: 8px 10px;
    text-align: left;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    background: var(--surface3);
  }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
  tbody tr:hover { background: rgba(57,255,110,0.02); }
  tbody td { padding: 12px 10px; vertical-align: middle; font-size: 13px; }
  .td-account { color: var(--text-muted); font-size: 12px; }
  .td-name { font-weight: 500; }
  .td-id { font-family: monospace; font-size: 12px; color: var(--text-muted); }
  .td-date { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  .copy-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text-muted);
    font-size: 11px;
    padding: 3px 8px;
    cursor: pointer;
    font-family: -apple-system, sans-serif;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .copy-btn:hover { border-color: var(--border-hover); color: var(--green); }
  .copy-btn.copied { border-color: rgba(57,255,110,0.4); color: var(--green); }

  /* ACCOUNT GROUP */
  .account-group-header {
    padding: 8px 10px;
    background: rgba(57,255,110,0.04);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    font-weight: 600;
    color: var(--green);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .account-group-header .dot { width: 6px; height: 6px; background: var(--green); border-radius: 50%; }

  /* EMPTY */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
    font-size: 13px;
  }

  /* SPINNER */
  .loader {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(57,255,110,0.2);
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }

  /* SELECTED COUNT */
  .sel-count { font-size: 12px; color: var(--text-muted); }
  .sel-count span { color: var(--green); font-weight: 600; }
</style>
</head>

    <div class="header-title"><span>APEX</span> Pixel TT</div>
  </div>
  <div id="clock"></div>
</header>

<div class="layout">

  <!-- LEFT: CREATE -->
  <div>
    <div class="card">
      <div class="card-title">✦ Создать пиксели</div>

      <div class="accounts-header">
        <div class="sel-count">Выбрано: <span id="sel-count">0</span></div>
        <div class="sel-btns">
          <button class="sel-btn" onclick="selectAll()">Выбрать все</button>
          <button class="sel-btn" onclick="deselectAll()">Снять все</button>
        </div>
      </div>

      <div id="accounts-list">
        <div class="empty-state">Загрузка аккаунтов...</div>
      </div>

      <div class="form-group">
        <label class="form-label">Название пикселя</label>
        <input class="form-input" type="text" id="pixel-name" placeholder="PL | VARI">
      </div>

      <div class="form-group">
        <label class="form-label">Event Type</label>
        <select class="form-input" id="event-type">
          <option value="SubmitForm">SubmitForm</option>
          <option value="ViewContent">ViewContent</option>
          <option value="AddToCart">AddToCart</option>
          <option value="Purchase">Purchase</option>
          <option value="CompletePayment">CompletePayment</option>
        </select>
      </div>

      <button class="create-btn" id="create-btn" onclick="createPixels()">
        ✦ Создать пиксели
      </button>

      <div class="results" id="results"></div>
    </div>
  </div>

  <!-- RIGHT: PIXELS LIST -->
  <div>
    <div class="card">
      <div class="card-title">
        ≡ Все пиксели
        <span class="count-badge" id="total-count">0</span>
      </div>
      <div class="table-toolbar">
        <div style="font-size:12px;color:var(--text-muted)" id="last-updated"></div>
        <button class="refresh-btn" id="refresh-btn" onclick="loadPixels()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 4v6h-6M1 20v-6h6"/>
            <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0018.49 15"/>
          </svg>
          Обновить
        </button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Аккаунт</th>
              <th>Название пикселя</th>
              <th>ID</th>
              <th>Создан</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="pixels-tbody">
            <tr><td colspan="5"><div class="empty-state">Загрузка...</div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<script>
const API = 'https://terrific-enthusiasm-production-cd66.up.railway.app';
let accounts = [];
let selectedIds = new Set();

// Clock
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}
setInterval(updateClock, 1000);
updateClock();

// Load accounts
async function loadAccounts() {
  try {
    const r = await fetch(`${API}/accounts`);
    accounts = await r.json();
    renderAccounts();
  } catch(e) {
    document.getElementById('accounts-list').innerHTML =
      '<div class="empty-state">Ошибка загрузки аккаунтов</div>';
  }
}

function renderAccounts() {
  const el = document.getElementById('accounts-list');
  if (!accounts.length) {
    el.innerHTML = '<div class="empty-state">Нет подключённых аккаунтов</div>';
    return;
  }
  el.innerHTML = accounts.map(a => `
    <div class="account-item ${selectedIds.has(a.id) ? 'selected' : ''}" onclick="toggleAccount(${a.id})">
      <input type="checkbox" ${selectedIds.has(a.id) ? 'checked' : ''} onclick="event.stopPropagation();toggleAccount(${a.id})">
      <div>
        <div class="account-name">${a.account_name}</div>
        <div class="account-id">${a.advertiser_id}</div>
      </div>
    </div>
  `).join('');
  document.getElementById('sel-count').textContent = selectedIds.size;
}

function toggleAccount(id) {
  if (selectedIds.has(id)) selectedIds.delete(id);
  else selectedIds.add(id);
  renderAccounts();
}

function selectAll() {
  accounts.forEach(a => selectedIds.add(a.id));
  renderAccounts();
}

function deselectAll() {
  selectedIds.clear();
  renderAccounts();
}

// Create pixels
async function createPixels() {
  if (!selectedIds.size) { alert('Выбери хотя бы один аккаунт'); return; }
  const name = document.getElementById('pixel-name').value.trim();
  if (!name) { alert('Введи название пикселя'); return; }
  const event_type = document.getElementById('event-type').value;

  const btn = document.getElementById('create-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="loader"></span> Создаём...';
  document.getElementById('results').innerHTML = '';

  try {
    const r = await fetch(`${API}/pixels/create-bulk`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ account_ids: [...selectedIds], pixel_name: name, event_type })
    });
    const data = await r.json();
    renderResults(data);
    await loadPixels();
  } catch(e) {
    document.getElementById('results').innerHTML =
      '<div class="result-item err"><span class="result-icon">✗</span><div>Ошибка запроса</div></div>';
  }

  btn.disabled = false;
  btn.innerHTML = '✦ Создать пиксели';
}

function renderResults(data) {
  const el = document.getElementById('results');
  el.innerHTML = data.map(r => `
    <div class="result-item ${r.error ? 'err' : 'ok'}">
      <span class="result-icon">${r.error ? '✗' : '✓'}</span>
      <div>
        <div class="result-name">${r.account_name}</div>
        ${r.pixel_id ? `<div class="result-pid">${r.pixel_id}</div>` : ''}
        ${r.error ? `<div class="result-err">${r.error}</div>` : ''}
      </div>
    </div>
  `).join('');
}

// Load pixels
async function loadPixels() {
  const btn = document.getElementById('refresh-btn');
  btn.classList.add('spinning');

  try {
    const r = await fetch(`${API}/pixels/list`);
    const data = await r.json();
    renderPixels(data);
    const now = new Date();
    document.getElementById('last-updated').textContent =
      'Обновлено в ' + now.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
  } catch(e) {
    document.getElementById('pixels-tbody').innerHTML =
      '<tr><td colspan="5"><div class="empty-state">Ошибка загрузки</div></td></tr>';
  }

  btn.classList.remove('spinning');
}

function renderPixels(data) {
  const tbody = document.getElementById('pixels-tbody');
  let total = 0;
  let html = '';

  data.forEach(acc => {
    if (!acc.pixels || !acc.pixels.length) return;
    total += acc.pixels.length;
    html += `
      <tr>
        <td colspan="5">
          <div class="account-group-header">
            <div class="dot"></div>
            ${acc.account_name}
            <span style="color:var(--text-muted);font-weight:400;font-size:11px">${acc.advertiser_id}</span>
            <span style="margin-left:auto;color:var(--text-muted);font-weight:400">${acc.pixels.length} пикс.</span>
          </div>
        </td>
      </tr>
    `;
    acc.pixels.forEach(p => {
      const date = p.create_time
        ? new Date(p.create_time * 1000).toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit', year:'numeric'})
        : '—';
      html += `
        <tr>
          <td class="td-account">${acc.account_name}</td>
          <td class="td-name">${p.pixel_name || '—'}</td>
          <td class="td-id">${p.pixel_id}</td>
          <td class="td-date">${date}</td>
          <td>
            <button class="copy-btn" onclick="copyId('${p.pixel_id}', this)">Copy ID</button>
          </td>
        </tr>
      `;
    });
  });

  if (!html) {
    tbody.innerHTML = '<tr><td colspan="5"><div class="empty-state">Пикселей нет</div></td></tr>';
  } else {
    tbody.innerHTML = html;
  }

  document.getElementById('total-count').textContent = total;
}

function copyId(id, btn) {
  navigator.clipboard.writeText(id).then(() => {
    btn.textContent = '✓ Скопировано';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy ID'; btn.classList.remove('copied'); }, 1500);
  });
}

// Init
loadAccounts();
loadPixels();
</script>

</body>
</html>
